name: V16b affine-substituted XNF development
on:
  push:
    paths:
      - v16b_affine_substitute_xnf.py
      - v16b_bench.py
      - .github/workflows/v16b-bench.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Xorricane
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-all-dev libgmp-dev libtool autoconf >/dev/null
          git clone https://github.com/j-danner/Xorricane.git xorricane-src
          cd xorricane-src
          git checkout 74ca967b2514da262943614dfe2610fda0c3737d
          git submodule update --init --recursive
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target xorricane -j2
          XOR=$(find "$PWD/build" -type f -name xorricane -perm -111 | head -1);test -n "$XOR";echo "$XOR" > ../XORRICANE_PATH.txt
      - name: Run V16b development sweep
        shell: bash
        run: |
          set -euo pipefail
          export XORRICANE="$(cat XORRICANE_PATH.txt)"
          python3 v16b_bench.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16b-bench
          path: |
            v16b
            v16b_affine_substitute_xnf.py
            v16b_bench.py
            v15_nearmiss_candidates.csv
          retention-days: 30
